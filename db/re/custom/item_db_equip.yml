    Name: Corrupted Shadow Weapon
    Type: ShadowGear
    Locations:
      Shadow_Weapon: true
    EquipLevelMin: 1
    Refineable: true
    Script: |
      .@r = getrefine();
      bonus bBaseAtk,8*(.@r/2);
      bonus bMatk,8*(.@r/2);
