  - Id: 410386
    AegisName: Raven_Of_Tomb_LT
    Name: Raven Of Tomb-LT
    Type: Armor
    Weight: 10
    Defense: 10
    Locations:
      Head_Mid: true
    ArmorLevel: 1
    EquipLevelMin: 210
    View: 1035
    Script: |
      bonus bBaseAtk,60;
      bonus bMatkRate,60;
      if (readparam(bStr) >= 84) {
         bonus2 bAddClass,Class_All,4;
         bonus bHit,10;
         if (readparam(bStr) >= 108) {
            bonus2 bAddClass,Class_All,6;
            bonus bHit,10;
         }
      }
      if (readparam(bInt) >= 84) {
         bonus bMatkRate,4;
         bonus2 bMagicAtkEle,Ele_All,4;
         if (readparam(bInt) >= 108) {
            bonus bMatkRate,6;
            bonus2 bMagicAtkEle,Ele_All,6;
         }
      }
      if (readparam(bDex) >= 84) {
         bonus bDelayrate,-4;
         bonus bCritical,6;
         if (readparam(bDex) >= 108) {
            bonus bDelayrate,-6;
            bonus bCritical,9;
         }
      }
      if (readparam(bVit) >= 84) {
         bonus bMaxHPrate,4;
         bonus bAspdRate,4;
         if (readparam(bVit) >= 108) {
            bonus bMaxHPrate,4;
            bonus bAspdRate,4;
         }
      }
      if (readparam(bLuk) >= 84) {
         bonus bBaseAtk,40;
         bonus bMatk,40;
         if (readparam(bLuk) >= 108) {
            bonus bBaseAtk,60;
            bonus bMatk,60;
         }
      }
      if (readparam(bAgi) >= 84) {
         bonus bFlee,10;
         bonus bCritAtkRate,7;
         if (readparam(bAgi) >= 108) {
            bonus bFlee,10;
            bonus bCritAtkRate,7;
         }
      }
      if ((readparam(bStr)+readparam(bAgi)+readparam(bVit)+readparam(bInt)+readparam(bDex)+readparam(bLuk)) >= 500) {
         bonus bPAtk,10;
         bonus bSMatk,10;
      }
