  - Id: 401043
    AegisName: Great_Kiel_US
    Name: Kiel Successor Doll
    Type: Armor
    Weight: 200
    Defense: 50
    Slots: 1
    Locations:
      Head_Top: true
    ArmorLevel: 2
    EquipLevelMin: 100
    Refineable: true
    Gradable: true
    View: 910
    Script: |
      .@g = getenchantgrade();
      .@r = getrefine();
      bonus bASPD,10;
      bonus bMaxHPRate,15;
      bonus bMaxSPRate,15;
      bonus bLongAtkRate,20+7*(.@r/2);
      bonus bPow,.@r/2;
      bonus bAllStats,7*(.@r/3);
      if (.@r>=10) {
         bonus bLongAtkRate,15;
         if (.@r>=11) {
            bonus bAllStats,7;
            bonus bBaseAtk,70;
            bonus5 bAutoSpell,"ASC_BREAKER",10,70,BF_LONG|BF_WEAPON|BF_NORMAL,1;
            if (.@r>=12) {
               bonus bAllStats,7;
               bonus bBaseAtk,70;
               bonus5 bAutoSpell,"SN_SHARPSHOOTING",5,100,BF_LONG|BF_WEAPON|BF_NORMAL,1;
               if (.@r>=13) {
                  bonus bAllStats,20;
                  bonus bBaseAtk,200;
                  bonus5 bAutoSpell,"RA_ARROWSTORM",10,150,BF_LONG|BF_WEAPON|BF_NORMAL,1;
                  if (.@r>=14) {
                     bonus bBaseAtk,250;
                     bonus bDelayRate,-25;
                     bonus bFixedCast,-500;
                  }
               }
            }
         }
      }
      if (.@g>=ENCHANTGRADE_D) {
         bonus bPAtk,15;
         if (.@g>=ENCHANTGRADE_C) {
            bonus bMaxHPRate,20;
            bonus bMaxSPRate,20;
            if (.@g>=ENCHANTGRADE_B) {
               bonus2 bIgnoreDefRaceRate,RC_All,50;
               if (.@g>=ENCHANTGRADE_A) {
                  bonus bAllStats,8;
                  bonus bAllTraitStats,8;
               }
            }
         }
      }
      if (getpetinfo(PETINFO_EGGID) == 9118) {
         if (getpetinfo(PETINFO_INTIMATE) >= PET_INTIMATE_LOYAL) {
            bonus bAllStats,5;
            bonus bAllTraitStats,5;
            bonus bSpeedRate,25;
         }
      }
