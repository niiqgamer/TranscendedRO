  - Id: 300673
    AegisName: Upd_Sup_No_Card
    Name: Upgrade Super Novice 2 Card
    Type: Card
    Buy: 20
    Weight: 10
    Locations:
      Garment: true
    Flags:
      DropEffect: CLIENT
    Script: |
      .@r = getrefine();
      bonus2 bAddSize,Size_All,4*(.@r/3);
      bonus2 bMagicAddSize,Size_All,4*(.@r/3);
      if (BaseLevel>=175)
         bonus bAllStats,15;
      if (.@r>=10)
         bonus bAllStats,15;
      if (BaseJob == JOB_SUPER_NOVICE || BaseJob == JOB_HYPER_NOVICE) {
         bonus bMaxHPrate,15;
         bonus2 bAddRace,RC_All,15;
         bonus2 bMagicAddRace,RC_All,15;
      }
