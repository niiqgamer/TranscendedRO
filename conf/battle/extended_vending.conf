//--------------------------------------------------------------
// Extended Vending Configuration File
//--------------------------------------------------------------
// Lets merchants choose the currency of their vending shop:
// Zeny, Cash Points, or any item listed in db/item_vending_db.yml.
// Based on the Extended Vending system by Lilith / Easycore.
//--------------------------------------------------------------
// Note 1: Value is a config switch (on/off, yes/no or 1/0)
//--------------------------------------------------------------

// Enable the extended vending system? (Note 1)
// When on, using Vending shows a currency selection list first.
// WARNING: Turning this off later does NOT convert existing autotrade shops to Zeny.
// Autotraders that sell for Cash/items are simply not reloaded (their items stay in the cart).
extended_vending: on

// When a player opens a shop that sells for Cash/items, show the currency
// as an announcement (on) or as a chat message (off)? (Note 1)
show_broadcast_info: on

// Prefix the shop title with the currency name, e.g. "[Donation Coin] My Shop"? (Note 1)
// Only applied to shops that do not sell for Zeny.
show_item_vending: on

// Show the vendor a detailed sale message (item, amount, revenue and currency)? (Note 1)
ex_vending_info: on

// Send the vendor a RODEX mail with a report of each sale? (Note 1)
// Players can opt out by setting the permanent character variable NOVREPORT to 1.
ex_vending_report: on

// Allow buyers to pay with character/account bound currency items? (Note 1)
// WARNING: The vendor receives normal (unbound) items, so this lets bound items be traded.
ex_buying_bound: off

// Dummy item ID that represents Zeny in the currency list. Set to 0 to disallow Zeny shops.
// The item must exist in the item DB (and in the client's item info so it shows a name/icon).
item_zeny: 30000

// Dummy item ID that represents Cash Points in the currency list. Set to 0 to disallow Cash shops.
// The item must exist in the item DB (and in the client's item info so it shows a name/icon).
item_cash: 30001
